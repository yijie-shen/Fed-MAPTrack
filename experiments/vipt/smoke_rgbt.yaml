# Smoke-test config. Derived from deep_rgbt.yaml.
# Only "how long / how verbose" is changed. Nothing that affects results
# (architecture, LR, loss weights, augmentation, CE schedule) is touched.
#
# NOTE: keep this file pure ASCII. lib/config/vipt/config.py opens the yaml
# with open(path) and no encoding=, so on Windows it is decoded with the
# locale codec (GBK here). A non-ASCII byte raises UnicodeDecodeError.
#
# Diff vs deep_rgbt.yaml (6 items):
#   TRAIN.EPOCH                  60    -> 1      stop after one epoch
#   DATA.TRAIN.SAMPLE_PER_EPOCH  60000 -> 320    320/32 = 10 steps
#   DATA.VAL.SAMPLE_PER_EPOCH    10000 -> 160    160/32 = 5 steps
#   TRAIN.VAL_EPOCH_INTERVAL     5     -> 1      exercise the val path too
#   TRAIN.PRINT_INTERVAL         50    -> 2      5 prints over 10 steps
#   TRAIN.NUM_WORKER             10    -> 4      DataLoader uses spawn on Windows
#   TRAIN.SAVE_EPOCH_INTERVAL    5     -> 1      exercise checkpoint saving
#
# BATCH_SIZE stays at the official 32 (per GPU). Official runs 2 GPUs =>
# effective batch 64. We run one GPU => effective 32. Fine for a smoke test,
# but a real reproduction must recover effective batch 64 via gradient
# accumulation, otherwise the numbers will not match the paper.
DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 1
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
  TRAIN:
    DATASETS_NAME:
    - LasHeR_train
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 320
  VAL:
    DATASETS_NAME:
    - LasHeR_val
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 160
MODEL:
  PRETRAIN_FILE: "./pretrained/OSTrack_ep0300.pth.tar"
  EXTRA_MERGER: False
  RETURN_INTER: False
  BACKBONE:
    TYPE: vit_base_patch16_224_ce_prompt
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [0.7, 0.7, 0.7]
    CE_TEMPLATE_RANGE: 'CTR_POINT'  # choose between ALL, CTR_POINT, CTR_REC, GT_BOX
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256
TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  CE_START_EPOCH: 4  # candidate elimination start epoch 1/15
  CE_WARM_EPOCH: 16  # candidate elimination warm up epoch 4/15
  BATCH_SIZE: 32
  EPOCH: 1
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0004
  LR_DROP_EPOCH: 48  # 4/5
  NUM_WORKER: 4
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 2
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 1
  WEIGHT_DECAY: 0.0001
  AMP: False
  PROMPT:
    TYPE: vipt_deep
  FIX_BN: true
  SAVE_EPOCH_INTERVAL: 1
  SAVE_LAST_N_EPOCH: 1
TEST:
  EPOCH: 1
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
